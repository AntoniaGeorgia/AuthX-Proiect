{% extends "base.html" %}
{% block title %}Resetare parola{% endblock %}
{% block content %}
<div class="box" style="margin-top:40px;">
    <h2>Resetare parola</h2>
    <form method="POST" action="/forgot-password">
        <label>Email</label>
        <input type="email" name="email" required>
        <button type="submit">Trimite token</button>
    </form>
    <div class="link"><a href="/login">Inapoi la login</a></div>
</div>
{% endblock %}
